<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark navy background -->
  <circle cx="100" cy="100" r="100" fill="#04101f"/>

  <!-- Outer chain/rope ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#D4AA4A" stroke-width="9" stroke-dasharray="6,3.5" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#B8861E" stroke-width="1.5"/>

  <!-- NW kite arm of the central X -->
  <path d="M93,79 L56,52 L52,56 L79,93 Z" fill="#D4AA4A"/>
  <!-- NE kite arm -->
  <path d="M107,79 L144,52 L148,56 L121,93 Z" fill="#D4AA4A"/>
  <!-- SW kite arm -->
  <path d="M79,107 L52,144 L56,148 L93,121 Z" fill="#D4AA4A"/>
  <!-- SE kite arm -->
  <path d="M121,107 L148,144 L144,148 L107,121 Z" fill="#D4AA4A"/>

  <!-- North: 3-spike tulip/flower element -->
  <path d="M96,86 L100,60 L104,86 Z" fill="#D4AA4A"/>
  <path d="M87,89 L80,66 L96,83 Z" fill="#D4AA4A"/>
  <path d="M113,89 L120,66 L104,83 Z" fill="#D4AA4A"/>

  <!-- West diamond -->
  <path d="M66,100 L79,90 L87,100 L79,110 Z" fill="#D4AA4A"/>
  <!-- East diamond -->
  <path d="M134,100 L121,90 L113,100 L121,110 Z" fill="#D4AA4A"/>

  <!-- South: double downward chevron -->
  <path d="M88,116 L100,128 L112,116 L107,112 L100,122 L93,112 Z" fill="#D4AA4A"/>
  <path d="M91,129 L100,140 L109,129 L105,126 L100,135 L95,126 Z" fill="#D4AA4A"/>

  <!-- Center hub -->
  <circle cx="100" cy="100" r="8" fill="#D4AA4A"/>
</svg>
